[package]
name = "joplin-interop"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11"
console_error_panic_hook = "0.1.7"
one2html = { version = "1.3.0", default-features = false, features = ["onepkg"] }
onenote_parser = { version = "1.1.0", default-features = false, features = ["onepkg"] }
wasm-bindgen = "0.2"
web-sys = "0.3.85"
js-sys = "0.3.85"
wasm-logger = "0.2.0"

[patch.crates-io]
one2html = { git = "https://github.com/msiemens/one2html", branch = "joplin-merge" }
onenote_parser = { git = "https://github.com/msiemens/onenote.rs", branch = "joplin-merge" }

[lib]
crate-type = ["cdylib", "lib"]
